[package]
name = "icc-ranking-api"
version = "0.1.0"
edition = "2021"
authors = ["ICC Ranking Team"]
description = "REST API backend for the ICC team ranking platform"

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
# ─── Web framework ────────────────────────────────────────────────────────────
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# ─── Async runtime ────────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ─── Database ────────────────────────────────────────────────────────────────
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "macros"] }

# ─── Serialisation ───────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ─── Error handling ──────────────────────────────────────────────────────────
thiserror = "1"
anyhow = "1"

# ─── Logging / tracing ───────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# ─── Date / time ─────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ─── Config ──────────────────────────────────────────────────────────────────
dotenvy = "0.15"

# ─── HTTP status ─────────────────────────────────────────────────────────────
http = "1"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
