[project]
name = "twelfth-man"
version = "0.1.0"
description = "AI chatbot for ICC Rankings — powered by LangGraph + Claude"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "psycopg[binary,pool]>=3.2.0",
    "motor>=3.6.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "sqlparse>=0.5.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
twelfth-man = "app.main:run"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
