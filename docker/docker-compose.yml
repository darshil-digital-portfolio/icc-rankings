services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: icc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: icc
      POSTGRES_PASSWORD: icc_secret
      POSTGRES_DB: icc_ranking
    ports:
      - "54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-readonly-user.sql:/docker-entrypoint-initdb.d/init-readonly-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icc -d icc_ranking"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB (chat history for Twelfth Man chatbot) ─────────────────────────
  mongo:
    image: mongo:7
    container_name: icc_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: icc_ranking
    ports:
      - "47017:27017"          # host:47017 → container:27017 (default mongo port inside container)
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Rust API ────────────────────────────────────────────────────────────────
  api:
    build:
      context: ../apps/api
      dockerfile: ../../docker/Dockerfile.api
    container_name: icc_api
    restart: unless-stopped
    ports:
      - "7429:7429"
    environment:
      DATABASE_URL: postgresql://icc:icc_secret@postgres:5432/icc_ranking
      API_HOST: 0.0.0.0
      API_PORT: 7429
      RUST_LOG: info
      SEED_ON_STARTUP: "true"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Next.js Web ─────────────────────────────────────────────────────────────
  web:
    build:
      context: ../apps/web
      dockerfile: ../../docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://api:7429
    container_name: icc_web
    restart: unless-stopped
    ports:
      - "5237:5237"
    environment:
      NEXT_PUBLIC_API_URL: http://api:7429
      PORT: 5237
    depends_on:
      - api

  # ── Twelfth Man AI Chatbot (Python/LangGraph) ───────────────────────────────
  chatbot:
    build:
      context: ../ai_chatbot
      dockerfile: ../docker/Dockerfile.chatbot
    container_name: icc_chatbot
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL: postgresql://icc_readonly:icc_readonly_secret@postgres:5432/icc_ranking
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: icc_ranking
      HOST: 0.0.0.0
      PORT: 8100
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
